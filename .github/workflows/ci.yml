name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contract-checks:
    name: Contract Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      WASM_SIZE_LIMIT_BYTES: 327680
      WASM_SIZE_WARN_PERCENT: 80
      WASM_SIZE_FAIL_PERCENT: 95
    defaults:
      run:
        working-directory: ./contracts/wine-black
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Add Soroban WASM target
        run: rustup target add wasm32v1-none

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Measure contract WASM size
        working-directory: .
        run: |
          bash scripts/measure-contract-wasm-size.sh \
            --manifest-path contracts/wine-black/Cargo.toml \
            --report-path "$RUNNER_TEMP/wasm-size/head.json" \
            --out-dir "$RUNNER_TEMP/wasm-size/head-build"

  bot-checks:
    name: Bot Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bot
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test
